<!doctype html>
<html lang="ar">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>إعادة تعيين كلمة المرور - المساعد الطبي</title>
    <link rel="icon" href="../../img/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/bootstrap.min.css">
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .reset-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f8ff;
            padding: 20px;
        }
        .reset-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
            padding: 40px;
            text-align: center;
        }
        .reset-card .icon {
            width: 80px;
            height: 80px;
            background: #e3f2fd;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: #4260a0;
            font-size: 40px;
        }
        .reset-card h2 {
            color: #2c3e50;
            font-weight: 700;
            margin-bottom: 15px;
        }
        .email-display {
            background: #f0f4ff;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            color: #4260a0;
            font-weight: 600;
            direction: ltr;
            word-break: break-all;
        }
        .alert {
            border-radius: 10px;
            padding: 15px 20px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        .alert.show {
            display: block;
        }
        .alert-success {
            background: #d4edda;
            color: #155724;
        }
        .btn-primary {
            background: #4260a0;
            border: none;
            padding: 12px;
            font-weight: 600;
            border-radius: 8px;
            width: 100%;
            color: white;
            cursor: pointer;
        }
        .form-control {
            height: 50px;
            border-radius: 8px;
            border: 1px solid #e1e1e1;
            padding: 10px 15px;
            font-family: 'Tajawal', sans-serif;
            width: 100%;
            margin-bottom: 15px;
        }
        .password-hint {
            font-size: 12px;
            color: #7f8c8d;
            margin-top: 5px;
            text-align: right;
        }
    </style>
</head>

<body>
    <div class="reset-container">
        <div class="reset-card">
            <div class="icon">
                <i class="icofont-key"></i>
            </div>
            
            <h2>إعادة تعيين كلمة المرور</h2>
            
            <div id="emailDisplay" class="email-display">جاري التحميل...</div>
            <div id="messageAlert" class="alert"></div>
            
            <form id="resetForm">
                <div class="form-group">
                    <input type="password" class="form-control" id="newPassword" placeholder="كلمة المرور الجديدة" required>
                </div>
                
                <div class="form-group">
                    <input type="password" class="form-control" id="confirmPassword" placeholder="تأكيد كلمة المرور" required>
                </div>
                
                <div class="password-hint">
                    <i class="icofont-info-circle"></i> كلمة المرور يجب أن تكون 6 أحرف على الأقل
                </div>
                
                <button type="submit" class="btn-primary" id="submitBtn">
                    تغيير كلمة المرور
                </button>
            </form>
        </div>
    </div>

    <script src="../../js/jquery.min.js"></script>
    <script src="../../js/bootstrap.min.js"></script>
    <script>
    $(document).ready(function() {
        // قراءة البريد من الرابط
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email');
        
        if (!email) {
            $('#emailDisplay').text('❌ رابط غير صالح');
            $('#submitBtn').prop('disabled', true);
            return;
        }
        
        $('#emailDisplay').text(`📧 ${decodeURIComponent(email)}`);
        
        $('#resetForm').on('submit', function(e) {
            e.preventDefault();
            
            const newPass = $('#newPassword').val();
            const confirmPass = $('#confirmPassword').val();
            
            if (newPass.length < 6) {
                showMessage('❌ كلمة المرور يجب أن تكون 6 أحرف على الأقل', 'danger');
                return;
            }
            
            if (newPass !== confirmPass) {
                showMessage('❌ كلمة المرور غير متطابقة', 'danger');
                return;
            }
            
            $('#submitBtn').prop('disabled', true).text('جاري الحفظ...');
            
            $.ajax({
                url: 'http://localhost:3000/api/password/reset-password',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ 
                    email: decodeURIComponent(email), 
                    newPassword: newPass 
                }),
                success: function(response) {
                    if (response.success) {
                        showMessage('✅ تم تغيير كلمة المرور بنجاح', 'success');
                        setTimeout(function() {
                            window.location.href = 'login.html';
                        }, 2000);
                    } else {
                        showMessage('❌ ' + response.message, 'danger');
                        $('#submitBtn').prop('disabled', false).text('تغيير كلمة المرور');
                    }
                },
                error: function(xhr) {
                    const error = xhr.responseJSON?.message || 'حدث خطأ في الاتصال بالخادم';
                    showMessage('❌ ' + error, 'danger');
                    $('#submitBtn').prop('disabled', false).text('تغيير كلمة المرور');
                }
            });
        });
        
        function showMessage(msg, type) {
            const alertDiv = $('#messageAlert');
            alertDiv.removeClass('alert-success alert-danger').addClass('alert-' + type);
            alertDiv.html(msg);
            alertDiv.addClass('show');
        }
    });
    </script>
</body>

</html>
