<!doctype html>
<html lang="ar">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>نسيت كلمة المرور - المساعد الطبي</title>
    <link rel="icon" href="../../img/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/bootstrap.min.css">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/dark-mode.css">
    <style>
        .forgot-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f8ff;
            padding: 20px;
        }

        .forgot-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 450px;
            width: 100%;
            padding: 40px;
            text-align: center;
        }

        .forgot-card .icon {
            width: 80px;
            height: 80px;
            background: #e3f2fd;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: #4260a0;
            font-size: 40px;
        }

        .forgot-card h2 {
            color: #2c3e50;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .alert {
            border-radius: 10px;
            padding: 15px 20px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            text-align: right;
        }

        .alert.show {
            display: block;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-success a {
            color: #155724;
            text-decoration: underline;
        }

        .alert-danger {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .back-to-login {
            margin-top: 20px;
            display: inline-block;
            color: #4260a0;
            text-decoration: none;
        }

        .btn-primary {
            background: #4260a0;
            border: none;
            padding: 12px;
            font-weight: 600;
            border-radius: 8px;
            width: 100%;
            color: white;
            cursor: pointer;
        }

        .form-control {
            height: 50px;
            border-radius: 8px;
            border: 1px solid #e1e1e1;
            padding: 10px 15px;
            font-family: 'Tajawal', sans-serif;
            width: 100%;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>
    <div class="forgot-container">
        <div class="forgot-card">
            <div class="icon">
                <i class="icofont-lock"></i>
            </div>

            <h2>نسيت كلمة المرور؟</h2>
            <p>أدخل بريدك الإلكتروني</p>

            <div id="messageAlert" class="alert"></div>

            <form id="forgotForm">
                <div class="form-group">
                    <input type="email" class="form-control" id="email" placeholder="البريد الإلكتروني" required>
                </div>

                <button type="submit" class="btn-primary">
                    إرسال رابط إعادة التعيين
                </button>
            </form>

            <a href="login.html" class="back-to-login">
                <i class="icofont-swoosh-left"></i> العودة إلى تسجيل الدخول
            </a>
        </div>
    </div>

    <script src="../../js/jquery.min.js"></script>
    <script src="../../js/bootstrap.min.js"></script>
    <script>
        $(document).ready(function () {
            $('#forgotForm').on('submit', function (e) {
                e.preventDefault();

                const email = $('#email').val();

                if (!email) {
                    showMessage('❌ الرجاء إدخال البريد الإلكتروني', 'danger');
                    return;
                }

                $.ajax({
                    url: 'http://localhost:3000/api/password/forgot-password',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({ email }),
                    success: function (response) {
                        if (response.success) {
                            showMessage(`
                            <div style="text-align: right;">
                                ✅ ${response.message}<br><br>
                                <strong>الرابط:</strong><br>
                                <a href="${response.resetLink}" target="_blank" style="color: #155724; word-break: break-all;">
                                    ${response.resetLink}
                                </a><br><br>
                                <small>انسخ الرابط أو اضغط عليه</small>
                            </div>
                        `, 'success');
                            $('#email').val('');
                        } else {
                            showMessage('❌ ' + response.message, 'danger');
                        }
                    },
                    error: function (xhr) {
                        const error = xhr.responseJSON?.message || 'حدث خطأ في الاتصال بالخادم';
                        showMessage('❌ ' + error, 'danger');
                    }
                });
            });

            function showMessage(msg, type) {
                const alertDiv = $('#messageAlert');
                alertDiv.removeClass('alert-success alert-danger').addClass('alert-' + type);
                alertDiv.html(msg);
                alertDiv.addClass('show');
            }
        });
    </script>

</body>

</html>
