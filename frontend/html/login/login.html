<!doctype html>
<html lang="ar">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>تسجيل الدخول - المساعد الطبي</title>
    <link rel="icon" href="../../img/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/bootstrap.min.css">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/dark-mode.css">
</head>

<body>
    <div class="preloader">
        <div class="loader">
            <div class="loader-outter"></div>
            <div class="loader-inner"></div>
            <div class="indicator">
                <svg width="16px" height="12px">
                    <polyline points="1 6 4 6 6 11 10 1 12 6 15 6"></polyline>
                </svg>
            </div>
        </div>
    </div>

    <div class="content">
        <div class="d-flex justify-content-start">
            <div class="blue-side-login">
                <p><img src="../../img/logo.png" alt="logo"> المساعد الطبي</p>
                <span>منصة طبية عربية تُعنى بتقديم المحتوى الطبي الموثوق، بأقلام آلاف الأطباء المعتمدين.</span>
            </div>
            <div class="white-side-login">
                <h3 class="title mb-5">تسجيل الدخول</h3>
                <form id="loginForm" class="form" style="max-width: 440px; margin: auto;">
                    <div class="form-group">
                        <input type="email" name="email" id="email" placeholder="البريد الإلكتروني" required>
                    </div>
                    <div class="form-group">
                        <input type="password" name="password" id="password" placeholder="كلمة المرور" required autocomplete="current-password">
                    </div>
                    <p style="text-align: right; font-size: 14px;"><a href="register.html">ليس لديك حساب؟ سجل الآن</a></p>
                    <div class="form-group login-btn">
                        <button class="btn" type="submit" id="loginBtn">تسجيل الدخول</button>
                    </div>
                    <p style="text-align: right; font-size: 14px; margin-bottom: 15px;">
                        <a href="forgot-password.html">نسيت كلمة المرور؟</a>
                    </p>
                </form>
            </div>
        </div>
    </div>

    <script src="../../js/jquery.min.js"></script>
    <script src="../../js/bootstrap.min.js"></script>
    <script src="../../js/validation.js"></script>
    <script src="../../js/common.js"></script>
    
    <script>
        $(document).ready(function () {
            $('#loginForm').on('submit', async function (e) {
                e.preventDefault();

                const email = $('#email').val();
                const password = $('#password').val();

                // التحقق من صحة البيانات
                const emailValid = Validator.email(email);
                const passValid = Validator.password(password, { minLength: 6 });

                if (!emailValid.valid) {
                    msg.error(emailValid.errors[0]);
                    return;
                }

                if (!passValid.valid) {
                    msg.error(passValid.errors[0]);
                    return;
                }

                $('#loginBtn').prop('disabled', true).text('جاري تسجيل الدخول...');

                try {
                    const response = await fetch('http://localhost:3000/api/users/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });

                    const data = await response.json();

                    if (data.success) {
                        localStorage.setItem('token', data.token);
                        localStorage.setItem('user', JSON.stringify(data.user));
                        msg.success('تم تسجيل الدخول بنجاح');
                        setTimeout(() => {
                            window.location.href = '../home.html';
                        }, 1500);
                    } else {
                        msg.error(data.message || 'خطأ في تسجيل الدخول');
                        $('#loginBtn').prop('disabled', false).text('تسجيل الدخول');
                    }
                } catch (error) {
                    msg.error('حدث خطأ في الاتصال بالخادم');
                    $('#loginBtn').prop('disabled', false).text('تسجيل الدخول');
                }
            });
        });
    </script>
</body>

</html>
