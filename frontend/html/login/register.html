<!doctype html>
<html lang="ar">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>تسجيل جديد - المساعد الطبي</title>
    <link rel="icon" href="../../img/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/bootstrap.min.css">
    <link rel="stylesheet" href="../../css/nice-select.css">
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
    <div class="preloader">
        <div class="loader">
            <div class="loader-outter"></div>
            <div class="loader-inner"></div>
            <div class="indicator">
                <svg width="16px" height="12px">
                    <polyline points="1 6 4 6 6 11 10 1 12 6 15 6"></polyline>
                </svg>
            </div>
        </div>
    </div>

    <div class="content">
        <div class="d-flex justify-content-start">
            <div class="blue-side-login">
                <p><img src="../../img/logo.png" alt="logo"> المساعد الطبي</p>
                <span>منصة طبية عربية تُعنى بتقديم المحتوى الطبي الموثوق، بأقلام آلاف الأطباء المعتمدين.</span>
            </div>
            <div class="white-side-login">
                <h3 class="title mb-5">تسجيل الأطباء</h3>
                <form id="registerForm" class="form">
                    <div class="row">
                        <div class="col-lg-6">
                            <div class="form-group">
                                <input type="text" name="firstname" id="firstname" placeholder="الاسم الأول" required>
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <div class="form-group">
                                <input type="text" name="lastname" id="lastname" placeholder="الاسم الأخير" required>
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="form-group">
                                <input type="email" name="email" id="email" placeholder="البريد الإلكتروني" required>
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="form-group">
                                <input type="password" name="password" id="password" placeholder="كلمة المرور" required>
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="form-group">
                                <input type="password" id="confirm_password" placeholder="تأكيد كلمة المرور" required>
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <div class="form-group">
                                <input type="tel" name="phone" id="phone" placeholder="رقم الموبايل" required>
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <div class="form-group">
                                <select name="specialization" id="specialization">
                                    <option value="">اختر التخصص</option>
                                    <option value="باطني">باطني</option>
                                    <option value="أنف وأذن وحنجرة">أنف وأذن وحنجرة</option>
                                    <option value="جلدية">جلدية</option>
                                    <option value="قلب وأوعية دموية">قلب وأوعية دموية</option>
                                    <option value="جهاز هضمي">جهاز هضمي</option>
                                    <option value="كلى">كلى</option>
                                    <option value="نفسي">نفسي</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="form-group login-btn">
                        <button class="btn login" type="submit">تسجيل</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="../../js/jquery.min.js"></script>
    <script src="../../js/bootstrap.min.js"></script>
    <script src="../../js/niceselect.js"></script>
    <script src="../../js/common.js"></script>
    <script>
    $(document).ready(function() {
        $('#registerForm').on('submit', async function(e) {
            e.preventDefault();
            
            const password = $('#password').val();
            const confirm = $('#confirm_password').val();
            
            if (password !== confirm) {
                alert('كلمة المرور غير متطابقة');
                return;
            }
            
            const userData = {
                firstname: $('#firstname').val(),
                lastname: $('#lastname').val(),
                email: $('#email').val(),
                password: password,
                phone: $('#phone').val(),
                specialization: $('#specialization').val()
            };
            
            try {
                const response = await fetch('http://localhost:3000/api/users/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userData)
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert('تم التسجيل بنجاح! يمكنك تسجيل الدخول الآن');
                    window.location.href = 'login.html';
                } else {
                    alert(data.message || 'حدث خطأ في التسجيل');
                }
            } catch (error) {
                alert('حدث خطأ في الاتصال بالخادم');
            }
        });
    });
    </script>
</body>
</html>
