<!doctype html>
<html lang="ar">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>إعادة تعيين كلمة المرور - المساعد الطبي</title>
    <link rel="icon" href="../img/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .reset-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f8ff;
            padding: 20px;
        }
        
        .reset-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
            padding: 40px;
            text-align: center;
        }
        
        .reset-card .icon {
            width: 80px;
            height: 80px;
            background: #e3f2fd;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: #4260a0;
            font-size: 40px;
        }
        
        .reset-card h2 {
            color: #2c3e50;
            font-weight: 700;
            margin-bottom: 15px;
        }
        
        .alert {
            border-radius: 10px;
            padding: 12px 20px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        
        .alert.show {
            display: block;
        }
        
        .password-hint {
            font-size: 12px;
            color: #7f8c8d;
            margin-top: 5px;
            text-align: right;
        }
    </style>
</head>

<body>
    <div class="reset-container">
        <div class="reset-card">
            <div class="icon">
                <i class="icofont-key"></i>
            </div>
            
            <h2>إعادة تعيين كلمة المرور</h2>
            <p>أدخل كلمة المرور الجديدة</p>
            
            <div id="messageAlert" class="alert"></div>
            
            <form id="resetForm">
                <input type="hidden" id="token">
                
                <div class="form-group">
                    <input type="password" class="form-control" id="newPassword" placeholder="كلمة المرور الجديدة" required>
                </div>
                
                <div class="form-group">
                    <input type="password" class="form-control" id="confirmPassword" placeholder="تأكيد كلمة المرور" required>
                </div>
                
                <div class="password-hint">
                    <i class="icofont-info-circle"></i> كلمة المرور يجب أن تكون 6 أحرف على الأقل
                </div>
                
                <button type="submit" class="btn btn-primary btn-block" style="width: 100%; padding: 12px; margin-top: 20px;">
                    تغيير كلمة المرور
                </button>
            </form>
        </div>
    </div>

    <script src="../js/jquery.min.js"></script>
    <script src="../js/bootstrap.min.js"></script>
    <script>
    $(document).ready(function() {
        // الحصول على token من الرابط
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        
        if (!token) {
            $('#messageAlert').addClass('alert-danger show').html('رابط غير صالح');
            return;
        }
        
        $('#token').val(token);
        
        // التحقق من صحة الرابط
        $.ajax({
            url: 'http://localhost:3000/api/password/verify-token/' + token,
            type: 'GET',
            success: function(response) {
                if (!response.success) {
                    showMessage(response.message, 'danger');
                }
            },
            error: function(xhr) {
                showMessage('الرابط غير صالح أو منتهي الصلاحية', 'danger');
            }
        });
        
        $('#resetForm').on('submit', function(e) {
            e.preventDefault();
            
            const newPassword = $('#newPassword').val();
            const confirmPassword = $('#confirmPassword').val();
            
            if (newPassword.length < 6) {
                showMessage('كلمة المرور يجب أن تكون 6 أحرف على الأقل', 'danger');
                return;
            }
            
            if (newPassword !== confirmPassword) {
                showMessage('كلمة المرور غير متطابقة', 'danger');
                return;
            }
            
            $.ajax({
                url: 'http://localhost:3000/api/password/reset-password',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ token, newPassword }),
                success: function(response) {
                    if (response.success) {
                        showMessage('✅ تم تغيير كلمة المرور بنجاح', 'success');
                        setTimeout(function() {
                            window.location.href = 'login/login.html';
                        }, 2000);
                    } else {
                        showMessage(response.message, 'danger');
                    }
                },
                error: function(xhr) {
                    const error = xhr.responseJSON?.message || 'حدث خطأ في الاتصال بالخادم';
                    showMessage(error, 'danger');
                }
            });
        });
        
        function showMessage(msg, type) {
            const alertDiv = $('#messageAlert');
            alertDiv.removeClass('alert-success alert-danger').addClass('alert-' + type);
            alertDiv.html(msg);
            alertDiv.addClass('show');
        }
    });
    </script>
</body>

</html>
